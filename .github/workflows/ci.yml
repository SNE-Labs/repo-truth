name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run ci
      - name: Verify installed CLI from a real clone
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PACKAGE=$(npm pack --silent)
          TMP=$(mktemp -d)
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$PACKAGE" >/dev/null
          ./node_modules/.bin/repo-truth --help >/dev/null
          cd "$GITHUB_WORKSPACE"
          "$TMP/node_modules/.bin/repo-truth" scan . --limit 20 --json > local-smoke.json
          node -e "const r=require('./local-smoke.json'); if(r.repository!=='SNE-Labs/repo-truth'||!r.source?.coverage||r.source.coverage.requested_limit!==20) process.exit(1)"
      - name: Probe npm package names
        run: |
          for NAME in repo-truth-cli github-repo-truth agent-repo-truth repository-truth; do
            if npm view "$NAME" name version repository.url --json > npm-view.json 2> npm-view.err; then
              echo "$NAME EXISTS"
              cat npm-view.json
            else
              echo "$NAME AVAILABLE_OR_UNPUBLISHED"
              cat npm-view.err
            fi
            echo "---"
          done