name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish
        required: true
        default: v0.1.2

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm run ci
      - name: Verify package identity
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='repo-truth-cli'||p.version!=='0.1.2') process.exit(1)"
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}